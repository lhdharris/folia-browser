<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>Folia Browser</title>
  <link rel="icon" href="folia-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">

      <div id="nav-buttons">
        <button id="back" disabled title="Back">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <polyline points="10,3 5,8 10,13" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
        <button id="fwd" disabled title="Forward">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <polyline points="6,3 11,8 6,13" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
        <button id="menu" title="Menu">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="3"  r="1.5" fill="currentColor"/>
            <circle cx="8" cy="8"  r="1.5" fill="currentColor"/>
            <circle cx="8" cy="13" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <button id="lock-button" hidden title="Site permissions">
          <svg class="lock-closed" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3" y="7" width="10" height="7" rx="1.2" stroke="currentColor"
                  stroke-width="1.5" fill="none"/>
            <path d="M5 7 V5 a3 3 0 0 1 6 0 V7" stroke="currentColor" stroke-width="1.5"
                  fill="none" stroke-linecap="round"/>
          </svg>
          <svg class="lock-open" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3" y="7" width="10" height="7" rx="1.2" stroke="currentColor"
                  stroke-width="1.5" fill="none"/>
            <path d="M5 7 V5 a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.5"
                  fill="none" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div id="permission-popover" hidden></div>

      <div id="app-menu-backdrop" hidden></div>
      <div id="app-menu" hidden>
        <button class="item" data-action="new-window">New window</button>
        <button class="item has-submenu" data-action="closed-folias">
          Previously closed Folias
          <span class="submenu-chevron" aria-hidden="true">›</span>
        </button>
        <div class="separator"></div>
        <button class="item" data-action="refresh" data-needs-page>Refresh<span class="accel" data-key="R"></span></button>
        <button class="item" data-action="copy-url" data-needs-page>Copy URL</button>
        <button class="item" data-action="save-pdf" data-needs-page>Save page as PDF…</button>
        <div class="separator"></div>
        <button class="item" data-action="settings">Settings</button>
      </div>
      <!-- Fly-out submenu for "Previously closed Folias". Anchored to the
           right of the parent item by toolbar.js; populated on every open
           so the list stays current within a session. -->
      <div id="closed-folias-submenu" hidden></div>

      <div id="drag-space">
        <input id="url-bar" type="text" autocomplete="off" spellcheck="false"
               placeholder="Type a URL or search…" hidden>
      </div>

      <button id="download-ring" hidden title="Download" aria-label="Download">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle class="track" cx="11" cy="11" r="9" stroke="#d8d8d8" stroke-width="2" fill="none"/>
          <circle class="fill"  cx="11" cy="11" r="9" stroke="#89cff0" stroke-width="2" fill="none"
                  stroke-linecap="round" transform="rotate(-90 11 11)"
                  stroke-dasharray="56.55" stroke-dashoffset="56.55"/>
          <path class="arrow" d="M11 6 V14 M8 11 L11 14 L14 11" stroke="#89cff0" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <polyline class="check" points="7,11 10,14 15,8" stroke="#89cff0" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>
        </svg>
      </button>

      <div id="wm-buttons">
        <button id="sticky" disabled title="Sticky Note">
          <svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">
            <!-- Square with the top-right corner folded down. The "fold" is
                 a small triangle whose hypotenuse is the visible page edge. -->
            <path d="M1 1 H7 L10 4 V10 H1 Z" stroke="currentColor" stroke-width="1.3"
                  fill="none" stroke-linejoin="round"/>
            <path d="M7 1 V4 H10" stroke="currentColor" stroke-width="1.3"
                  fill="none" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="maximize" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" stroke="currentColor" stroke-width="1.5"
                  fill="none" rx="1"/>
          </svg>
        </button>
        <button id="close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
            <line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div id="progress-bar"></div>
    </div>

    <div id="webview-wrap">
      <webview id="content" allowpopups partition="persist:folia"></webview>
      <!-- Find-in-page bar. Floats over the page (no layout reflow / guest
           resize) — toggled by Ctrl-F. Driven entirely by webview.findInPage. -->
      <div id="find-bar" hidden>
        <input id="find-input" type="text" placeholder="Find in page" spellcheck="false">
        <span id="find-count"></span>
        <button id="find-prev" title="Previous (Shift+Enter)">‹</button>
        <button id="find-next" title="Next (Enter)">›</button>
        <button id="find-close" title="Close (Esc)">×</button>
      </div>
      <!-- Custom error overlay; replaces Chromium's default error page with
           a minimalist Folia-styled message. Driven by did-fail-load. -->
      <div id="webview-error" hidden>
        <div class="webview-error-inner">
          <div class="webview-error-title"></div>
          <div class="webview-error-detail"></div>
          <button id="webview-error-proceed" hidden>Proceed anyway</button>
        </div>
      </div>
    </div>

    <!-- Sticky-note overlay. Hidden by default; shown via body.sticky-mode
         while the OS window is animated down to STICKY_W×STICKY_H in main.
         Post-it chrome modelled on res/notation-app: an opaque title strip
         at the top is the drag handle and carries the always-visible action
         buttons; the comment body scrolls behind it; a corner grip resizes. -->
    <div id="sticky-overlay" hidden>
      <div id="sticky-header">
        <span id="sticky-audio-icon" title="Audio playing">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 6 H6 L9.5 3 V13 L6 10 H3 Z" fill="currentColor"/>
            <path d="M11.5 5 Q13.5 8 11.5 11" stroke="currentColor" stroke-width="1.3"
                  fill="none" stroke-linecap="round"/>
          </svg>
        </span>
        <div id="sticky-title"></div>
      </div>
      <!-- Action icons live in the title strip, always visible (a hover
           reveal is unreliable next to a -webkit-app-region: drag strip —
           the compositor swallows hover events over drag regions). Each is
           a no-drag click target so the strip around them still drags. -->
      <div id="sticky-actions">
        <button class="sticky-action-btn" id="sticky-new" title="New window">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="5" y1="1" x2="5" y2="9" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
            <line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
          </svg>
        </button>
        <button class="sticky-action-btn" id="sticky-restore" title="Restore">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" stroke="currentColor" stroke-width="1.5"
                  fill="none" rx="1"/>
          </svg>
        </button>
        <button class="sticky-action-btn" id="sticky-x" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
            <line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="sticky-comment" contenteditable="true"
           data-placeholder="What's this for?"></div>
      <!-- Resize grip (bottom-right). Frameless Wayland windows expose no
           compositor resize edges, so the grip drives the resize from
           relative pointer deltas — see toolbar.js. -->
      <div id="sticky-resize" title="Drag to resize">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M11 4 L4 11 M11 8 L8 11" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round"/>
        </svg>
      </div>
      <!-- Mirror of #download-ring for sticky mode. The toolbar version is
           hidden when body.sticky-mode is set; this chip stays visible so
           the user still knows a download is in progress and can click it
           to open the file when complete. State is driven by the same
           onDownload handler in toolbar.js. -->
      <button id="sticky-download" hidden title="Download" aria-label="Download">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle class="track" cx="11" cy="11" r="9" stroke="#d8d8d8" stroke-width="2" fill="none"/>
          <circle class="fill"  cx="11" cy="11" r="9" stroke="#89cff0" stroke-width="2" fill="none"
                  stroke-linecap="round" transform="rotate(-90 11 11)"
                  stroke-dasharray="56.55" stroke-dashoffset="56.55"/>
          <path class="arrow" d="M11 6 V14 M8 11 L11 14 L14 11" stroke="#89cff0" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <polyline class="check" points="7,11 10,14 15,8" stroke="#89cff0" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
