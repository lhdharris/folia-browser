<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self'">
  <link rel="icon" href="folia-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="screen-picker.css">
  <title>Choose what to share</title>
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span class="title">Choose what to share</span>
      <button id="close" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
          <line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <main>
      <section>
        <h2>Entire screen</h2>
        <div id="screens" class="grid"></div>
      </section>
      <section>
        <h2>Application window</h2>
        <div id="windows" class="grid"></div>
      </section>
      <p id="empty" class="hint" hidden>No sources available.</p>
    </main>

    <footer>
      <button id="cancel" class="action">Cancel</button>
      <button id="share" class="action primary" disabled>Share</button>
    </footer>
  </div>
  <script src="screen-picker.js"></script>
</body>
</html>
